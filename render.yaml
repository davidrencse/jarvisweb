services:
  - type: web
    name: jarvisweb
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /screens/*
        name: Cache-Control
        value: public, max-age=86400
    routes:
      - type: rewrite
        source: /architecture
        destination: /architecture.html
